<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load</title>
</head>
<body>
    <h2>SQL JS WASM Carga de archivo local</h2>
    <p>
        <label for="upload">Cargar archivo</label>
        <input type="file" name="upload" id="upload" accept=".sql,.sqlite,.sqlite3" />
    </p>

    <table>
        <thead>
            <tr>
                <td>Col 1</td>
                <td>Col 2</td>
            </tr>
        </thead>
        <tbody id="content">
            <tr>
                <td colspan="2">No hay registros</td>
            </tr>
        </tbody>
    </table>

    <script src="./sqlite/sql-wasm.js"></script>
    <script>
        (async function () {
            function handleChange(event) {
                file = event.target.files[0];

                // verificamos si esta cargado el archivo
                if (!file) return;

                const reader = new FileReader();

                reader.onload = async function (e) {
                    const bytes = new Uint8Array(e.target.result);
                    
                    // le pasamos el array de 8 bits al wasm
                    db = new SQL.Database(bytes);

                    // cargamos la tabla
                    await updateTable();
                };

                reader.readAsArrayBuffer(file);
            }

            /** permite actualiza la tabla */
            async function updateTable() {
                tableBody.innerHTML = '';

                const stmt = db.prepare('SELECT * FROM test WHERE col1 BETWEEN $start AND $end');

                // obtiene una busqueda personalizada
                // stmt.getAsObject({$start:1, $end:1}); // {col1:1, col2:111}

                // Bind new values
                stmt.bind({$start:1, $end:2});

                // bucle que recorre cada registro encontrado
                while(stmt.step()) { 
                    const row = stmt.getAsObject();
                    
                    tableBody.innerHTML += (`
                        <tr>
                            <td>${row.col1}</td>
                            <td>${row.col2}</td>
                        </tr>
                    `);
                }
            }

            // carga la libreria en el entorno global
            const { initSqlJs } = window;
            const input = document.querySelector('#upload');
            const tableBody = document.querySelector('#content');

            // database instance
            let SQL, db;
            
            input.addEventListener('change', handleChange);

            try {
                // localizamos el archivo wasm, en la propiedad 
                // locateFile usa el parametro si necesitas la url local
                SQL = await initSqlJs({
                    locateFile: localFileName => `./sqlite/${localFileName}`,
                });

                console.log('LOG: SQLWasm listo y cargado');

            } catch (error) {
                console.log(error);                
            }
        })();
    </script>
</body>
</html>
