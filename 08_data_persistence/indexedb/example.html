<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indexedb Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>IndexedDB Demo: storing blobs, e-publication example</h1>
    <div class="note">
        <p>Works and tested with:</p>
        <div id="compat"></div>
    </div>

    <div id="msg"></div>

    <div class="flex justify-content-start align-items-end">
        <form id="register-form">
            <div class="grid-2">
                <label for="pub-title" class="required">
                    Title
                </label>
                <input type="text" name="pub-title" id="pub-title" />
            </div>
            <div class="grid-2">
                <label class="required" for="pub-biblioid">
                    Bibliographic ID: <br /> 
                    <span class="note">(ISBN, ISSN, etc.)</span>
                </label>
                <input type="text" id="pub-biblioid" name="pub-biblioid" />
            </div>
            <div class="grid-2">
                <label for="pub-year">Year:</label>
                <input type="number" id="pub-year" name="pub-year" />
            </div>
            <div class="grid-2">
                <label for="pub-file">File image:</label>
                <input type="file" id="pub-file" name="pub-file" />
            </div>
            <div class="grid-2">
                <label for="pub-file-url">
                     Online-file image URL: <br />
                    <span class="note">(same origin URL)</span>
                </label>
                <input type="url" id="pub-file-url" />
            </div>
            <div class="button-pane">
                <input type="button" id="add-button" value="Add Publication" />
                <input type="reset" id="register-form-reset" value="reset form" />
            </div>
        </form>
        <form id="delete-form">
            <div class="grid-2">
                <label for="pub-biblioid-to-delete">
                    Bibliographic ID:<br />
                    <span class="note">(ISBN, ISSN, etc.)</span>
                </label>
                <input type="text" id="pub-biblioid-to-delete" name="pub-biblioid-to-delete" />
            </div>
            <div class="grid-2">
                <label for="key-to-delete">
                   Key:<br />
                   <span class="note">(for example 1, 2, 3, etc.)</span>
                 </label>
                 <input type="text" id="key-to-delete" name="key-to-delete" />
            </div>
             <div class="button-pane">
                <input type="button" id="delete-button" value="Delete Publication" />
                <input
                    type="button"
                    id="clear-store-button"
                    value="Clear the whole store"
                    class="destructive"
                />
            </div>
        </form>
        <form id="search-form">
            <div class="button-pane">
                <input
                    type="button"
                    id="search-list-button"
                    value="List database content"
                />
            </div>
        </form>
    </div>

    <div>
        <div id="pub-msg"></div>
        <div id="pub-viewer"></div>
        <ul id="pub-list"></ul>
    </div>
    <script src="main.js"></script>
</body>
</html>
